<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planner SEA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><path d='M8 10h6v14H8zM18 10h6v8h-6z' fill='white'/></svg>">
<style>
:root{--bg:#0e1015;--panel:#161921;--panel2:#1d212b;--line:#2a2f3c;--txt:#e7e9ef;--mut:#8d95a8;--acc:#6366f1;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:#a5b4fc}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
:disabled{opacity:.75;cursor:default}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;text-decoration:none;color:var(--txt);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#3b4252}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:#fca5a5}
.ico{background:none;border:0;color:var(--mut);padding:4px 6px;border-radius:6px}
.ico:hover{background:var(--panel2);color:var(--txt)}
.mut{color:var(--mut)}
/* pantallas simples */
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.boxc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:420px;width:100%;text-align:center}
.boxc h1{margin:8px 0 4px;font-size:24px}
.logo{width:56px;height:56px;border-radius:14px;background:var(--acc);display:inline-grid;place-items:center;font-size:26px}
/* layout */
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header .brand{font-weight:700;display:flex;align-items:center;gap:8px}
header .brand i{width:26px;height:26px;border-radius:7px;background:var(--acc);display:inline-block}
header .sp{flex:1}
.bell{position:relative}
.bell b{position:absolute;top:-2px;right:-4px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px}
.layout{display:flex;min-height:calc(100vh - 56px)}
aside{width:250px;flex:none;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
aside h4{margin:8px 6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.pj{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px}
.pj:hover{background:var(--panel2)}
.pj.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--c)}
.pj .n{display:flex;align-items:center;gap:8px;font-weight:500}
.pj .n i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--acc))}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.ph{padding:16px 20px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ph h2{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.ph h2 i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.ph .desc{width:100%;color:var(--mut);margin:0}
.tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--line);align-items:flex-end;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 12px;border-bottom:2px solid transparent;color:var(--mut)}
.tab.on{color:var(--txt);border-color:var(--c,var(--acc))}
.tabs .sp{flex:1}
.tabs .tg{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;padding-bottom:8px;cursor:pointer}
.tabs .tg input{width:auto}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);display:inline-flex;align-items:center;gap:4px}
.chip.bad{color:#fca5a5;border-color:#5b2626;background:#2a1414}
.chip.warn{color:#fcd34d;border-color:#5b4614;background:#2a2210}
.chip.ok{color:#86efac;border-color:#1f4d2e;background:#10241a}
/* tablero */
.board{display:flex;gap:14px;padding:16px 20px;overflow-x:auto;flex:1;align-items:flex-start}
.col{width:290px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:calc(100vh - 210px);display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--acc)}
.colh{display:flex;align-items:center;gap:6px;font-weight:600;padding:2px 4px 8px}
.colh span:first-child{flex:1}
.cnt{font-size:12px;color:var(--mut);font-weight:400}
.addt input{background:transparent;border-style:dashed;margin-bottom:8px}
.cards{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px}
.empty{color:var(--mut);font-size:12px;text-align:center;padding:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--p);border-radius:10px;padding:10px;cursor:pointer;position:relative}
.card:hover{border-color:#3b4252;border-left-color:var(--p)}
.card.done{opacity:.55}
.card.done .ttl{text-decoration:line-through}
.card .ttl{font-weight:500;margin:4px 0 8px;padding-right:22px;word-break:break-word}
.card .chk{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);background:none;padding:0;font-size:11px;line-height:16px;color:#fff}
.card .chk.on{background:var(--ok);border-color:var(--ok)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.prio{font-size:11px;font-weight:600;color:var(--p)}
.st{font-size:11px;color:#93c5fd}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.avs{margin-left:auto;display:flex}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;border:2px solid var(--panel2);margin-left:-6px;flex:none;object-fit:cover}
.av.l{width:32px;height:32px;font-size:12px;margin:0}
.addcol{width:240px;flex:none;background:none;border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--mut)}
/* historial */
.hist{padding:16px 20px;max-width:820px}
.day{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.ev{display:flex;gap:10px;padding:8px;border-radius:8px;align-items:flex-start}
.ev.clk{cursor:pointer}
.ev.clk:hover{background:var(--panel)}
.ev .av{margin:0}
.ev time{color:var(--mut);font-size:12px;margin-left:6px}
/* modal */
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:1040px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.mod.sm{max-width:480px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;flex:1;font-size:16px}
.mb{padding:4px 18px 18px;overflow-y:auto}
.tgrid{display:grid;grid-template-columns:1.25fr 1fr;flex:1;min-height:0}
.tgrid>div{overflow-y:auto;padding:4px 18px 18px}
.tgrid>div+div{border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:14px}
.ttitle{font-size:18px;font-weight:600}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick label{margin:0;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;color:var(--txt);font-size:13px;cursor:pointer}
.pick label.on{border-color:var(--acc);background:#23264a}
.pick input{display:none}
.sub{display:flex;align-items:center;gap:8px;padding:5px 0}
.sub input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--ok)}
.sub span{flex:1;word-break:break-word}
.sub.d span{text-decoration:line-through;color:var(--mut)}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:160px;padding-bottom:10px}
.msg{display:flex;gap:8px}
.msg .av{margin:0}
.msg .bd{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1;min-width:0}
.msg .bd p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.msg.me .bd{background:#20234a;border-color:#33378a}
.lk{display:inline-flex;gap:4px;margin:6px 6px 0 0;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp{border-top:1px solid var(--line);padding-top:10px}
.comp textarea{resize:vertical;min-height:60px}
.comp .r{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
details summary{cursor:pointer;color:var(--mut);margin-top:16px}
.mini .ev{padding:4px 0;font-size:13px}
/* notificaciones */
.np{position:absolute;right:12px;top:52px;width:360px;max-width:calc(100vw - 24px);max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0008;z-index:15}
.np .h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.nt{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px}
.nt:hover{background:var(--panel2)}
.nt.u{background:#1b1e3a}
.nt .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:6px;flex:none}
.nt:not(.u) .dot{visibility:hidden}
.menu{position:absolute;right:12px;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:15;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--panel2)}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 14px;max-width:340px;box-shadow:0 8px 30px #0008;animation:in .25s}
.toast.err{border-left-color:var(--bad)}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mem div{flex:1;min-width:0}
.mem small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis}
.nothing{padding:60px 20px;text-align:center;color:var(--mut)}
.notice{width:100%;background:#2a2210;border:1px solid #5b4614;color:#fde68a;border-radius:10px;padding:10px 14px;white-space:pre-wrap}
.lbl{font-size:11px;border-radius:5px;padding:1px 7px;color:#fff;background:hsl(var(--h) 45% 32%)}
.rev{font-size:11px;color:#fcd34d}
.pane{padding:16px 20px;flex:1}
.search{position:relative;flex:0 1 320px}
.search input{padding:6px 10px}
.sr{position:absolute;top:40px;left:0;right:0;min-width:300px;max-height:60vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px #0008;z-index:15}
.sr div{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sr div:hover{background:var(--panel2)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:8px;cursor:pointer}
.mrow:hover{border-color:#3b4252}
.mrow .t{flex:1;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--mut);text-align:center;padding:4px;text-transform:uppercase}
.cal .dc{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:4px;overflow:hidden}
.cal .dc.out{opacity:.35}
.cal .dc.today{border-color:var(--acc)}
.cal .dc.due{background:#2a1414;border-color:#5b2626}
.cal .dn{font-size:12px;color:var(--mut)}
.cal .ct{display:block;width:100%;text-align:left;font-size:11px;border:0;border-left:3px solid var(--p);background:var(--panel2);border-radius:4px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ct.done{opacity:.5;text-decoration:line-through}
.wl{display:grid;grid-template-columns:220px 1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wl .bars{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.wl .bars i{display:block;height:100%}
.men{color:#a5b4fc;font-weight:600}
#mbox{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
#mbox button{display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
#mbox button .av{margin:0}
.msg.ready .bd{background:#10241a;border-color:#1f4d2e}
.qa{position:absolute;right:6px;bottom:6px;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.card:hover .qa,.card:focus-within .qa{display:flex}
.pop{position:static;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px #0009;max-height:260px;overflow-y:auto;cursor:default}
.pop label{display:flex;align-items:center;gap:8px;margin:0;padding:4px;color:var(--txt);font-size:13px;cursor:pointer;border-radius:6px}
.pop label:hover{background:var(--panel2)}
.pop label input{width:auto}
.pop .av{margin:0}
.card.selected{outline:2px solid var(--acc)}
.selbox{position:absolute;top:8px;right:8px;width:18px;height:18px;accent-color:var(--acc)}
.compact .card{padding:6px 9px}
.compact .card .tags,.compact .card .meta>span:not(.avs):not(.chip){display:none}
.compact .card .ttl{margin:0 0 4px;font-size:13px}
.compact .cards{gap:5px}
.bulk{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;box-shadow:0 12px 40px #000a;z-index:12;max-width:calc(100vw - 24px)}
.mact{float:right;display:none}
.msg .bd:hover .mact{display:inline-flex}
.mact .ico{padding:0 4px}
.quote{border-left:3px solid var(--acc);background:#0003;border-radius:4px;padding:4px 8px;margin:4px 0;font-size:12px;color:var(--mut)}
.reacts{display:flex;gap:4px;margin-top:6px}
.reacts button{background:none;border:1px solid transparent;border-radius:999px;padding:0 6px;font-size:12px;opacity:.35}
.reacts button.has{opacity:1;border-color:var(--line);background:var(--panel)}
.reacts button.on{border-color:var(--acc);background:#23264a}
.msg .bd:hover .reacts button{opacity:1}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 8px;font:600 12px ui-monospace,monospace;min-width:54px;text-align:center}
@media(hover:none){.qa{display:flex;position:static;margin-top:6px;width:max-content}.mact{display:inline-flex}.reacts button{opacity:1}}
@media(max-width:800px){.wl{grid-template-columns:1fr}.cal .dc{min-height:60px}.search{flex:1}}
@media(max-width:800px){
  .layout{flex-direction:column}
  aside{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  aside h4{display:none}
  .pj{width:auto;flex:none;min-width:150px}
  .tgrid{grid-template-columns:1fr;overflow-y:auto}
  .tgrid>div{overflow:visible}
  .tgrid>div+div{border-left:0;border-top:1px solid var(--line)}
  .row4{grid-template-columns:1fr 1fr}
  .ov{padding:0}
  .mod{max-height:100vh;height:100vh;border-radius:0}
  .col{max-height:none;width:85vw}
  header .brand span{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Clave pública (anon): es segura en el navegador; la seguridad la ponen las reglas RLS de la base de datos.
const SB_URL = 'https://wnmrgnskdcioepmqvxin.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndubXJnbnNrZGNpb2VwbXF2eGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NDEwNDAsImV4cCI6MjEwOTAxNzA0MH0.5bnrLkc6NBKVXFPQP8Rtvz_reOWFmvGA4ZumgVs2Ux0';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { flowType: 'pkce' } });

const S = { user:null, me:null, profiles:[], projects:[], notifs:[], buckets:[], tasks:[], activity:[],
            pid:null, tid:null, comments:[], tact:[], view:'board', onlyMine:false, panel:null, modal:null, seen:null,
            mine:[], label:'', cal:null, found:null, reads:{}, reacts:[], sel:new Set(), selMode:false, pop:null, reply:null,
            hidden:new Set(), sort: ls('sort') || 'manual', compact: !!ls('compact') };
const PRIO = { urgente:['Urgente','#ef4444','‼'], importante:['Importante','#f59e0b','!'], media:['Media','#3b82f6','●'], baja:['Baja','#6b7280','↓'] };
const STATUS = { no_iniciada:'No iniciada', en_curso:'En curso', completada:'Completada' };
const COLORS = ['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#ec4899','#a855f7','#84cc16'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl = u => /^https?:\/\/\S+$/i.test((u||'').trim());
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const isAdmin = () => !!S.me?.is_admin;
const prof = id => S.profiles.find(p => p.id === id);
const pname = id => { const p = prof(id); return p ? (p.full_name || p.google_name || p.email) : 'Sistema'; };
const members = () => S.profiles.filter(p => p.approved || p.is_admin).sort((a,b) => pname(a.id).localeCompare(pname(b.id)));
const proj = () => S.projects.find(p => p.id === S.pid);
const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 360;
const lblHTML = l => `<span class="lbl" style="--h:${hue(l)}">${esc(l)}</span>`;
const folderId = u => (u || '').match(/folders\/([\w-]+)/)?.[1] || (u || '').match(/[?&]id=([\w-]+)/)?.[1];
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function dueProjectChip(p){
  if (!p.due_date) return '';
  const n = daysLeft(p.due_date), cls = n < 0 ? 'bad' : n <= 7 ? 'warn' : '';
  const txt = n < 0 ? `entregado/pasado (${fmtD(p.due_date)})` : n === 0 ? 'Entrega HOY' : n === 1 ? 'Entrega MAÑANA' : `Entrega ${fmtD(p.due_date)} · faltan ${n} días`;
  return `<span class="chip ${cls}">🏁 ${txt}</span>`;
}

function av(id, cls=''){
  const p = prof(id), n = pname(id);
  if (p?.avatar_url) return `<img class="av ${cls}" src="${esc(p.avatar_url)}" title="${esc(n)}" alt="" referrerpolicy="no-referrer">`;
  const h = [...(id||'x')].reduce((a,c) => a + c.charCodeAt(0), 0) % 360;
  const ini = n.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
  return `<span class="av ${cls}" style="background:hsl(${h} 55% 42%)" title="${esc(n)}">${esc(ini)}</span>`;
}
const fmtD = d => d ? new Date(d + 'T00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short'}) : '';
const fmtT = ts => new Date(ts).toLocaleString('es-ES', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
function ago(ts){
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return 'ahora';
  if (s < 3600) return `hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `hace ${Math.floor(s/3600)} h`;
  return fmtT(ts);
}
function daysLeft(d){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d + 'T00:00') - t) / 86400000); }
function dueChip(t){
  if (!t.due_date) return '';
  if (t.status === 'completada') return `<span class="chip">📅 ${fmtD(t.due_date)}</span>`;
  const n = daysLeft(t.due_date);
  if (n < 0) return `<span class="chip bad">⚠ Vencida ${fmtD(t.due_date)}</span>`;
  if (n === 0) return `<span class="chip warn">📅 Hoy</span>`;
  if (n === 1) return `<span class="chip warn">📅 Mañana</span>`;
  return `<span class="chip">📅 ${fmtD(t.due_date)}</span>`;
}
function toast(msg, cls=''){
  const el = document.createElement('div'); el.className = 'toast ' + cls; el.textContent = msg;
  $('#toasts').append(el); setTimeout(() => el.remove(), 5000);
}
async function q(p){
  const { data, error } = await p;
  if (error) { toast('Error: ' + error.message, 'err'); throw error; }
  return data;
}
// Vuelve a pintar sin perder lo que estás escribiendo (foco y borrador del chat).
function keep(fn){
  const a = document.activeElement, id = a?.id, val = id && 'value' in a ? a.value : null, pos = a?.selectionStart;
  const draft = $('#cbody')?.value;
  fn();
  if (draft != null && $('#cbody')) $('#cbody').value = draft;
  const e = id && document.getElementById(id);
  if (e) { if (val != null && e.tagName !== 'SELECT' && e.type !== 'checkbox') e.value = val; e.focus(); try { e.setSelectionRange(pos, pos); } catch {} }
}

async function saveName(){

let started = false;
sb.auth.onAuthStateChange((ev, session) => setTimeout(() => {
  if (!session) { S.user = null; started = false; return loginScreen(); }
  if (started && S.user?.id === session.user.id) return;
  S.user = session.user; started = true;
  if (location.search.includes('code=')) history.replaceState(null, '', location.pathname + location.hash);
  subscribe(); start();
}));

async function start(){
  const me = await q(sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle());
  S.me = me;
  if (!me) return screen(`<h1>Acceso denegado</h1><p class="mut">El administrador ha rechazado tu solicitud.</p><button class="btn" onclick="logout()">Cerrar sesión</button>`);
  if (!me.full_name) return nameScreen();
  if (!me.approved && !me.is_admin) return screen(`<h1>Solicitud enviada</h1>
    <p class="mut">Hola ${esc(me.full_name)}. El administrador tiene que aprobar tu acceso. Esta página se actualizará sola cuando te acepte.</p>
    <button class="btn" onclick="logout()">Cerrar sesión</button>`);
  await loadBase();
  readHash();
  await loadProject();
  await loadTask();
  if (!S.summaryDone) await buildSummary();
  else if (Date.now() - new Date(me.last_seen_at || 0) > 300000) sb.from('profiles').update({ last_seen_at: new Date().toISOString() }).eq('id', me.id).then(() => {});
  keep(() => { render(); renderModal(); });
}

// Resumen de lo que ha pasado desde tu última visita (solo al entrar).
async function buildSummary(){
  S.summaryDone = true;
  const since = S.me.last_seen_at;
  await q(sb.from('profiles').update({ last_seen_at: new Date().toISOString() }).eq('id', S.me.id));
  if (!since || S.modal) return;
  const ev = await q(sb.from('activity').select('*').gt('created_at', since).neq('actor_id', S.me.id).order('created_at', { ascending:false }).limit(200));
  if (!ev.length) return;
  S.summary = { since, ev }; S.modal = 'summary';
}

/* ============ DATOS ============ */
async function loadBase(){
  const [profiles, projects, notifs, mine, reads] = await Promise.all([
    q(sb.from('profiles').select('*')),
    q(sb.from('projects').select('*, tasks(status)').order('created_at')),
    q(sb.from('notifications').select('*').order('created_at', { ascending:false }).limit(80)),
    q(sb.from('tasks').select('id,title,status,priority,due_date,project_id,review_requested,labels,task_assignees!inner(user_id)').eq('task_assignees.user_id', S.me.id)),
    q(sb.from('task_reads').select('task_id,read_at')),
  ]);
  S.profiles = profiles; S.projects = projects; S.mine = mine;
  S.reads = Object.fromEntries(reads.map(r => [r.task_id, r.read_at]));
  const fresh = S.seen ? notifs.filter(n => !n.read && !S.seen.has(n.id)) : [];
  if (fresh.length > 2) toast(`🔔 Tienes ${fresh.length} notificaciones nuevas`); else fresh.forEach(n => toast('🔔 ' + n.message));
  if (fresh.length) beep();
  S.seen = new Set(notifs.map(n => n.id));
  S.notifs = notifs;
}
async function loadProject(){
  if (!S.projects.some(p => p.id === S.pid)) S.pid = (S.projects.find(p => !p.archived && !p.is_template) || S.projects[0])?.id || null;
  if (!S.pid) { S.buckets = []; S.tasks = []; S.activity = []; return; }
  const [b, t, a] = await Promise.all([
    q(sb.from('buckets').select('*').eq('project_id', S.pid).order('position')),
    q(sb.from('tasks').select('*, task_assignees(user_id), subtasks(id,done), comments(created_at,user_id)').eq('project_id', S.pid).order('position')),
    q(sb.from('activity').select('*').eq('project_id', S.pid).order('created_at', { ascending:false }).limit(300)),
  ]);
  S.buckets = b; S.tasks = t; S.activity = a;
}
async function loadTask(){
  if (S.tid && !S.tasks.some(t => t.id === S.tid)) { S.tid = null; if (S.modal === 'task') S.modal = null; }
  if (!S.tid) return;
  const [c, a, st] = await Promise.all([
    q(sb.from('comments').select('*').eq('task_id', S.tid).order('created_at')),
    q(sb.from('activity').select('*').eq('task_id', S.tid).order('created_at', { ascending:false }).limit(100)),
    q(sb.from('subtasks').select('*').eq('task_id', S.tid).order('position')),
  ]);
  S.comments = c; S.tact = a; S.subs = st;
  S.reacts = c.length ? await q(sb.from('comment_reactions').select('*').in('comment_id', c.map(x => x.id))) : [];
  // Marca el chat como leído (task_reads no está en tiempo real, así que no provoca bucles)
  const now = new Date().toISOString(); S.reads[S.tid] = now;
  sb.from('task_reads').upsert({ user_id: S.me.id, task_id: S.tid, read_at: now }).then(() => {});
}

// Tiempo real: cualquier cambio en la base de datos refresca lo que estás viendo.
let tmr;
function subscribe(){
  sb.channel('planner').on('postgres_changes', { event:'*', schema:'public' }, () => {
    clearTimeout(tmr); tmr = setTimeout(start, 400);
  }).subscribe();
}

function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (!S.restored) { S.restored = true; if (!h.get('p')) { S.pid = ls('pid') || S.pid; S.view = ls('view') || S.view; } }
  if (h.get('p')) S.pid = h.get('p');
  if (h.get('t')) { S.tid = h.get('t'); S.modal = 'task'; }
}
function setHash(){ history.replaceState(null, '', '#' + new URLSearchParams({ ...(S.pid && {p:S.pid}), ...(S.tid && {t:S.tid}) })); ls('pid', S.pid); ls('view', S.view); }
function setView(v){ S.view = v; S.sel.clear(); S.selMode = false; setHash(); render(); }
const taskLink = (pid, tid) => location.origin + location.pathname + '#' + new URLSearchParams({ p: pid, t: tid });
// Preferencias de este navegador (no pasa nada si el navegador las bloquea)
function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem('psea.' + k)); localStorage.setItem('psea.' + k, JSON.stringify(v)); } catch { return null; } }
let actx;
function beep(){
  if (ls('sound') === false) return;
  try { actx ||= new AudioContext(); const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.08, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.35); } catch {}
}
function toastUndo(msg, undo, commit){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `${esc(msg)} <button class="btn" style="margin-left:10px;padding:3px 10px">↶ Deshacer</button>`;
  const t = setTimeout(() => { el.remove(); commit?.(); }, 5000);
  el.querySelector('button').onclick = () => { clearTimeout(t); el.remove(); undo(); };
  $('#toasts').append(el);
}

function calHTML(){
  const p = proj(), base = S.cal || new Date(), y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - (first.getDay() + 6) % 7); // semana empieza en lunes
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = iso(new Date());
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d);
    const ts = S.tasks.filter(t => t.due_date === k);
    cells += `<div class="dc ${d.getMonth() !== m ? 'out' : ''} ${k === today ? 'today' : ''} ${k === p.due_date ? 'due' : ''}">
      <div class="dn">${d.getDate()}${k === p.due_date ? ' 🏁 <b style="color:#fca5a5">Entrega</b>' : ''}</div>
      ${ts.map(t => `<button class="ct ${t.status === 'completada' ? 'done' : ''}" style="--p:${PRIO[t.priority][1]}" title="${esc(t.title)}" onclick="openTask('${t.id}')">${esc(t.title)}</button>`).join('')}</div>`;
  }
  const mv = n => `S.cal=new Date(${y},${m + n},1);render()`;
  return `<div class="pane"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="btn" onclick="${mv(-1)}">‹</button><button class="btn" onclick="S.cal=null;render()">Hoy</button><button class="btn" onclick="${mv(1)}">›</button>
      <h3 style="margin:0 0 0 8px;text-transform:capitalize">${first.toLocaleDateString('es-ES', { month:'long', year:'numeric' })}</h3>
      ${S.tasks.some(t => !t.due_date) ? `<span class="mut" style="margin-left:auto;font-size:12px">${S.tasks.filter(t => !t.due_date).length} tareas sin fecha no aparecen</span>` : ''}</div>

function workload(){
  return members().map(u => {
    const ts = S.tasks.filter(t => t.task_assignees.some(a => a.user_id === u.id));

    const late = ts.filter(t => t.status !== 'completada' && t.due_date && daysLeft(t.due_date) < 0).length;

}

const PRANK = { urgente:0, importante:1, media:2, baja:3 };
// Tareas de una columna tal y como se ven (filtros + orden). Lo usan el tablero, el arrastre y las flechas.
function colTasks(bid){
  const cmp = {
    manual: (x, y) => x.position - y.position,
    due: (x, y) => (x.due_date || '9999').localeCompare(y.due_date || '9999'),
    prio: (x, y) => PRANK[x.priority] - PRANK[y.priority],
    person: (x, y) => (x.task_assignees[0] ? pname(x.task_assignees[0].user_id) : '~').localeCompare(y.task_assignees[0] ? pname(y.task_assignees[0].user_id) : '~'),
  }[S.sort] || ((x, y) => x.position - y.position);
  return S.tasks.filter(t => (t.bucket_id || null) === bid && !S.hidden.has(t.id)
      && (!S.onlyMine || t.task_assignees.some(a => a.user_id === S.me.id)) && (!S.label || (t.labels || []).includes(S.label)))
    .sort((x, y) => (x.status === 'completada') - (y.status === 'completada') || cmp(x, y) || x.position - y.position);
}
const visibleBuckets = () => S.buckets.filter(b => !S.hidden.has(b.id));
function boardOrder(){ return [...visibleBuckets().map(b => b.id), null].flatMap(colTasks); }

function actText(a){
  const d = a.details || {}, t = a.task_title ? `«${esc(a.task_title)}»` : '';
  switch (a.action) {
    case 'task_created': return `creó la tarea ${t}`;
    case 'task_deleted': return `eliminó la tarea ${t}`;
    case 'title_changed': return `renombró «${esc(d.from)}» a «${esc(d.to)}»`;
    case 'status_changed': return `cambió ${t} de ${STATUS[d.from]} a <b>${STATUS[d.to]}</b>`;
    case 'priority_changed': return `cambió la prioridad de ${t} a <b>${PRIO[d.to]?.[0]}</b>`;
    case 'due_changed': return d.to ? `puso la fecha límite de ${t} en <b>${fmtD(d.to)}</b>` : `quitó la fecha límite de ${t}`;
    case 'bucket_changed': return `movió ${t} a <b>${esc(d.to || 'Sin columna')}</b>`;
    case 'description_changed': return `editó la descripción de ${t}`;
    case 'drive_changed': return `cambió el enlace de Drive de ${t}`;
    case 'assigned': return `asignó ${t} a <b>${esc(d.name)}</b>`;
    case 'unassigned': return `quitó a <b>${esc(d.name)}</b> de ${t}`;
    case 'subtask_added': return `añadió la subtarea «${esc(d.title)}» a ${t}`;
    case 'subtask_done': return `completó la subtarea «${esc(d.title)}» de ${t}`;
    case 'subtask_undone': return `reabrió la subtarea «${esc(d.title)}» de ${t}`;
    case 'subtask_deleted': return `eliminó la subtarea «${esc(d.title)}» de ${t}`;
    case 'subtask_renamed': return `renombró una subtarea de ${t}`;
    case 'comment': return `comentó en ${t}${d.preview ? `: <i>${esc(d.preview)}</i>` : ' (enlace)'}`;
    case 'project_created': return `creó el proyecto <b>${esc(d.name)}</b>`;
    case 'project_updated': return `actualizó los datos del proyecto`;
    case 'ready': return `ha terminado su parte de ${t} y pide revisión ✅`;
    case 'notice': return `publicó un aviso: <i>${esc(d.text)}</i>`;
    default: return esc(a.action);
  }
}
function histHTML(list, byDay){
  if (!list.length) return '<p class="mut">Sin actividad todavía.</p>';
  let last = '';
  return list.map(a => {
    const day = new Date(a.created_at).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
    const head = byDay && day !== last ? `<div class="day">${(last = day)}</div>` : '';
    const clk = byDay && a.task_id && S.tasks.some(t => t.id === a.task_id);
    return `${head}<div class="ev ${clk ? 'clk' : ''}" ${clk ? `onclick="openTask('${a.task_id}')"` : ''}>${av(a.actor_id)}
      <div><b>${esc(pname(a.actor_id))}</b> ${actText(a)}<time>${byDay ? new Date(a.created_at).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : ago(a.created_at)}</time></div></div>`;
  }).join('');
}

// Junta las notificaciones sin leer del mismo tipo y tarea ("4 mensajes nuevos en «X»").
function notifGroups(){
  const out = [], idx = {};
  for (const n of S.notifs) {
    const key = !n.read && n.task_id && ['comment', 'status', 'due'].includes(n.type) ? n.type + n.task_id : n.id;
    if (idx[key]) idx[key].push(n); else out.push(idx[key] = [n]);
  }
  return out;
}

function renderModal(){

  const html = m === 'task' ? taskHTML() : m === 'members' ? membersHTML() : m === 'summary' ? summaryHTML() : m === 'keys' ? keysHTML()
             : projectFormHTML(m === 'project-edit' ? proj() : null);
  if (!html) { S.modal = null; return $('#modal').innerHTML = ''; }
  $('#modal').innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()">${html}</div>`;
  const c = $('#chatlist'); if (c) c.scrollTop = c.scrollHeight;
}
function openModal(m){ S.modal = m; S.panel = null; render(); renderModal(); }
function closeModal(){ S.modal = null; S.tid = null; S.reply = null; typingChannel(null); setHash(); renderModal(); render(); }
function navTask(d){ const list = boardOrder(), i = list.findIndex(t => t.id === S.tid), nx = list[i + d]; if (nx) openTask(nx.id); else toast(d > 0 ? 'Es la última tarea' : 'Es la primera tarea'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.pop || S.panel) { S.pop = null; S.panel = null; return render(); } if (S.modal) return closeModal(); }
  if (e.target.closest('input,textarea,select,[contenteditable]') || e.ctrlKey || e.metaKey || e.altKey || !S.me?.approved && !S.me?.is_admin) return;
  if (e.key === '/') { e.preventDefault(); $('#sq')?.focus(); }
  else if (S.modal === 'task' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) navTask(e.key === 'ArrowRight' ? 1 : -1);
  else if (S.modal) return;
  else if (e.key.toLowerCase() === 'n' && isAdmin() && proj()) { e.preventDefault(); if (S.view !== 'board') setView('board'); $('.addt input')?.focus(); }
  else if (e.key.toLowerCase() === 'm') setView('mine');
  else if ('12345'.includes(e.key) && proj()) setView(['board', 'cal', 'team', 'files', 'hist'][+e.key - 1]);
});

async function pasteTasks(e, bid){
  const lines = e.clipboardData.getData('text').split(/\r?\n/).map(s => s.replace(/^\s*([-*•·]|\d+[.)])\s*/, '').trim()).filter(Boolean);
  if (lines.length < 2) return;
  e.preventDefault();
  if (!confirm(`¿Crear ${lines.length} tareas?\n\n• ${lines.slice(0, 10).join('\n• ')}${lines.length > 10 ? '\n…' : ''}`)) return;
  const base = -Date.now();
  await q(sb.from('tasks').insert(lines.map((title, i) => ({ project_id: S.pid, bucket_id: bid, title: title.slice(0, 300), position: base + i }))));
  toast(`✔ ${lines.length} tareas creadas`);

// Mover una tarea (con Deshacer)
async function moveTask(t, bid, pos){
  const old = { bucket_id: t.bucket_id, position: t.position };
  if (old.bucket_id === bid && old.position === pos) return;
  Object.assign(t, { bucket_id: bid, position: pos }); render();
  await q(sb.from('tasks').update({ bucket_id: bid, position: pos }).eq('id', t.id));
  if (old.bucket_id !== bid) toastUndo(`«${t.title}» movida a ${S.buckets.find(b => b.id === bid)?.name || 'otra columna'}`,
    () => q(sb.from('tasks').update(old).eq('id', t.id)));
}
async function dropOnCol(e, bid){
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const d = e.dataTransfer.getData('text/plain');
  if (d.startsWith('col:')) { // reordenar columnas: la arrastrada queda antes de esta
    const id = d.slice(4), list = visibleBuckets(), i = list.findIndex(b => b.id === bid);
    if (id === bid || i < 0) return;
    const prev = list.filter(b => b.id !== id)[list.filter(b => b.id !== id).findIndex(b => b.id === bid) - 1];
    const pos = prev ? (prev.position + list[i].position) / 2 : list[i].position - 1;
    S.buckets.find(b => b.id === id).position = pos; S.buckets.sort((a, b) => a.position - b.position); render();
    return q(sb.from('buckets').update({ position: pos }).eq('id', id));
  }
  const t = S.tasks.find(x => x.id === d);
  if (!t || t.bucket_id === bid) return;
  moveTask(t, bid, Date.now());
}
async function dropOnCard(e, targetId){
  const d = e.dataTransfer.getData('text/plain'); if (d.startsWith('col:')) return;
  e.preventDefault(); e.stopPropagation(); e.currentTarget.closest('.col')?.classList.remove('over');
  const t = S.tasks.find(x => x.id === d), target = S.tasks.find(x => x.id === targetId);
  if (!t || !target || t.id === target.id) return;
  const list = colTasks(target.bucket_id).filter(x => x.id !== t.id), i = list.findIndex(x => x.id === targetId);
  const pos = i > 0 ? (list[i - 1].position + target.position) / 2 : target.position - 1; // queda justo encima de la tarjeta destino
  moveTask(t, target.bucket_id, pos);
}

async function bulk(kind, val){

// "Fulano está escribiendo…": mensajes efímeros por Realtime, no se guardan en la base de datos
let tch, typingAt = 0, typingTimers = {};
function typingChannel(tid){
  if (tch) { sb.removeChannel(tch); tch = null; }
  if (!tid) return;
  tch = sb.channel('typing:' + tid).on('broadcast', { event: 'typing' }, ({ payload }) => {
    if (payload.id === S.me.id) return;
    clearTimeout(typingTimers[payload.id]);
    typingTimers[payload.id] = setTimeout(() => { delete typingTimers[payload.id]; showTyping(); }, 3500);
    showTyping();
  }).subscribe();
}
function showTyping(){
  const el = $('#typing'); if (!el) return;
  const ns = Object.keys(typingTimers).map(pname);
  el.textContent = ns.length ? `✍️ ${ns.join(', ')} ${ns.length > 1 ? 'están' : 'está'} escribiendo…` : '';
}
function sendTyping(){ if (tch && Date.now() - typingAt > 2000) { typingAt = Date.now(); tch.send({ type: 'broadcast', event: 'typing', payload: { id: S.me.id } }); } }
async function sendReady(){
  if (!confirm('¿Avisar al administrador de que has terminado tu parte de esta tarea?')) return;
  await q(sb.from('comments').insert({ task_id: S.tid, kind: 'ready', body: '✅ He terminado mi parte. Lista para revisar.' }));
}
function mentionInput(el){
  const m = el.value.slice(0, el.selectionStart).match(/@([^\s@]*)$/);
  const box = $('#mbox');
  if (!m) return box.innerHTML = '';
  box.innerHTML = members().filter(p => p.id !== S.me.id && norm(pname(p.id)).includes(norm(m[1]))).slice(0, 6)
    .map(p => `<button type="button" onmousedown="event.preventDefault();pickMention('${p.id}')">${av(p.id)} ${esc(pname(p.id))}</button>`).join('');
}
function pickMention(id){
  const el = $('#cbody'), pos = el.selectionStart;
  const before = el.value.slice(0, pos).replace(/@([^\s@]*)$/, '@' + pname(id) + ' ');
  el.value = before + el.value.slice(pos); el.focus(); el.setSelectionRange(before.length, before.length);
  $('#mbox').innerHTML = '';
}
function mentionify(c){
  let h = linkify(c.body);
  for (const id of c.mentions || []) { const n = esc('@' + pname(id)); h = h.split(n).join(`<span class="men">${n}</span>`); }
  return h;
}

async function doSearch(v){
  v = v.replace(/[,()%*\\]/g, ' ').trim();
  if (v.length < 2) { S.found = null; if (S.panel === 'search') S.panel = null; return keep(render); }
  const [ts, cs] = await Promise.all([
    q(sb.from('tasks').select('id,title,project_id').or(`title.ilike.%${v}%,description.ilike.%${v}%`).limit(15)),
    q(sb.from('comments').select('body,task_id,user_id,tasks(title,project_id)').ilike('body', `%${v}%`).order('created_at', { ascending:false }).limit(15)),
  ]);
  const pn = id => S.projects.find(p => p.id === id)?.name || '';
  S.found = { q: v, items: [
    ...ts.map(t => ({ p: t.project_id, t: t.id, title: '📋 ' + t.title, sub: pn(t.project_id) })),
    ...cs.filter(c => c.tasks).map(c => ({ p: c.tasks.project_id, t: c.task_id, title: '💬 ' + c.body.slice(0, 80), sub: `${pname(c.user_id)} en «${c.tasks.title}» · ${pn(c.tasks.project_id)}` })),
  ] };
  S.panel = 'search'; keep(render);
}
async function jump(pid, tid){
  S.panel = null;
  if (pid !== S.pid || S.view === 'mine') await goProject(pid); else render();
  if (tid) openTask(tid);
}

// Informe: se abre en una pestaña nueva lista para "Guardar como PDF" desde el diálogo de imprimir.

  const [act, coms] = await Promise.all([
    q(sb.from('activity').select('*').eq('project_id', p.id).order('created_at')),
    q(sb.from('comments').select('user_id, tasks!inner(project_id)').eq('tasks.project_id', p.id)),
  ]);

  const names = t => t.task_assignees.map(a => esc(pname(a.user_id))).join(', ') || '—';
  const tasks = [...S.tasks].sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  const done = S.tasks.filter(t => t.status === 'completada').length;
  w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe – ${esc(p.name)}</title><style>
    body{font:12px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:#111;margin:28px}h1{margin:0;font-size:22px}h2{font-size:15px;margin:22px 0 8px;border-bottom:2px solid ${esc(p.color)};padding-bottom:4px}

    .k{display:flex;gap:24px;margin-top:12px}.k div{border:1px solid #ddd;border-radius:8px;padding:8px 14px}.k b{font-size:18px;display:block}
    @media print{button{display:none}}</style></head><body>
    <button onclick="print()" style="float:right;padding:8px 14px">🖨 Guardar como PDF</button>
    <h1>${esc(p.name)}</h1><div class="m">Informe generado el ${new Date().toLocaleString('es-ES')} · Planner SEA · 2º SEA – CIFP Politécnico de Cartagena</div>
    ${p.description ? `<p>${esc(p.description)}</p>` : ''}
    <div class="k"><div><b>${S.tasks.length}</b>tareas</div><div><b>${done}</b>completadas</div><div><b>${S.tasks.length ? Math.round(done / S.tasks.length * 100) : 0}%</b>progreso</div>${p.due_date ? `<div><b>${new Date(p.due_date + 'T00:00').toLocaleDateString('es-ES')}</b>fecha de entrega</div>` : ''}</div>
    <h2>Participación del equipo</h2><table><tr><th>Persona</th><th>Tareas asignadas</th><th>Completadas</th><th>Vencidas</th><th>Mensajes en el chat</th></tr>
    ${wl.map(x => `<tr><td>${esc(pname(x.u.id))}</td><td>${x.total}</td><td>${x.done}</td><td>${x.late}</td><td>${msgs(x.u.id)}</td></tr>`).join('')}</table>
    <h2>Tareas</h2><table><tr><th>Tarea</th><th>Responsables</th><th>Prioridad</th><th>Estado</th><th>Fecha límite</th><th>Completada el</th></tr>
    ${tasks.map(t => `<tr><td>${esc(t.title)}${(t.labels || []).length ? `<br><span class="m">${esc(t.labels.join(', '))}</span>` : ''}</td><td>${names(t)}</td><td>${PRIO[t.priority][0]}</td><td>${STATUS[t.status]}</td>
      <td>${t.due_date ? new Date(t.due_date + 'T00:00').toLocaleDateString('es-ES') : '—'}</td><td>${t.completed_at ? new Date(t.completed_at).toLocaleDateString('es-ES') : '—'}</td></tr>`).join('')}</table>
    <h2>Historial completo</h2><table><tr><th style="width:130px">Fecha</th><th style="width:150px">Persona</th><th>Acción</th></tr>
    ${act.map(a => `<tr><td>${new Date(a.created_at).toLocaleString('es-ES', { dateStyle:'short', timeStyle:'short' })}</td><td>${esc(pname(a.actor_id))}</td><td>${actText(a)}</td></tr>`).join('')}</table>
    </body></html>`);
  w.document.close();
}
